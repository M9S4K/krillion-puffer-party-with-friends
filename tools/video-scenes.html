<!doctype html><meta charset="utf-8"><title>video layers</title>
<link rel="stylesheet" href="../extension/content.css">
<style>
  /* Layers for the clip, laid out at exactly half of 1920x1080 so ffmpeg can
     pixel-double them with flags=neighbor and keep the type crisp.
     Text strips are white on black and get screen-blended, so they need no
     alpha channel. Everything else is captured on the video's own background. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  body { display: grid; place-items: center; }
  #out { overflow: hidden; background: #000; }

  .strip { display: grid; }
  .card {
    width: 960px; height: 180px; display: grid; place-items: center;
    background: #000; text-align: center; font-variant-ligatures: none;
  }
  .card .big {
    color: #fff; font: 400 46px/1.2 "KPJ Pixelify", monospace;
    font-variant-ligatures: none;
  }
  .card .huge {
    color: #fff; font: 400 72px/1.1 "KPJ Pixelify", monospace;
    font-variant-ligatures: none;
  }
  .card .sub {
    display: block; margin-top: 14px; color: #8a8a8a;
    font: 400 24px/1.3 "KPJ VT323", monospace; font-variant-ligatures: none;
  }
  .card .hi { color: #b9ffe0; }

  /* pieces captured in colour, on the clip's own background */
  .piece { width: 960px; height: 220px; display: grid; place-items: center;
           background: #070f1c; }
  .room {
    display: grid; grid-template-columns: 96px 1fr auto; align-items: center;
    gap: 20px; width: 560px; padding: 16px 22px; border-radius: 16px;
    background: #0e1b2e; border: 1.5px solid #1b2c47;
    font: 400 26px/1 "KPJ Pixelify", monospace; font-variant-ligatures: none;
    color: #a7b8d5;
  }
  .room b { color: #e8f1ff; font-weight: 400; letter-spacing: .06em; }
  .room .seats { font: 400 22px/1 "KPJ VT323", monospace; color: #7d93b8; }
  .room.hot { border-color: #2f5f49; box-shadow: 0 0 0 3px rgba(78,255,178,.12); }
  .room.hot .seats { color: #4effb2; }

  .panelbox { width: 960px; height: 340px; display: grid; place-items: center;
              background: #070f1c; }
  .art { position: relative; width: 460px; height: 320px; }
  .art iframe { position: absolute; inset: 0 auto auto 0; width: 330px; height: 230px;
                border: 0; background: transparent;
                transform: scale(1.393); transform-origin: top left; }

  .end { width: 960px; height: 540px; display: grid; place-items: center;
         background: radial-gradient(640px 420px at 50% 16%, #16324f, #050b14 72%); }
  .end .inner { display: grid; place-items: center; gap: 20px; text-align: center; }
  .end img { width: 112px; height: 112px; border-radius: 24px; }
  .end h2 { margin: 0; color: #e8f1ff; font: 400 40px/1.2 "KPJ Pixelify", monospace;
            font-variant-ligatures: none; }
  .end .url { color: #7d93b8; font: 400 23px/1 "KPJ VT323", monospace;
              letter-spacing: .04em; font-variant-ligatures: none; }
</style>
<div id="out"></div>
<script>
const card = (h, sub, cls = "big") =>
  `<div class="card"><div><span class="${cls}">${h}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</div></div>`;

const STRIPS = {
  // 4 text cards, 960x180 each -> one 960x720 capture, sliced in python
  a: `<div class="strip">
        ${card("you both hit Quick&nbsp;Play")}
        ${card("it drops you in the fullest lobby")}
        ${card("one seat.", "", "huge")}
        ${card("so you get split up", "every single time")}
      </div>`,
  b: `<div class="strip">
        ${card("so I fixed it")}
        ${card("type the same party name")}
        ${card('one of you joins a room', "everyone else is pulled in")}
        ${card("no clicking", "no codes read out loud")}
      </div>`,
  // colour pieces, 960x270 each
  c: `<div class="strip">
        <div class="piece"><div class="room hot"><b>YJKT</b><span>krillmaster</span>
          <span class="seats">3 / 4 &middot; one seat</span></div></div>
        <div class="panelbox"><div class="art">
          <iframe src="panel-frame.html?bare=1&v=31&s=linked-alone"></iframe></div></div>
      </div>`,
  e: `<div class="panelbox"><div class="art">
        <iframe src="panel-frame.html?bare=1&v=31&s=together"></iframe></div></div>`,
  d: `<div class="end"><div class="inner">
        <img src="../extension/icons/icon200.png" alt="">
        <h2>Krillion Puffer Party<br>With Friends</h2>
        <div class="url">github.com/M9S4K/krillion-puffer-party-with-friends</div>
      </div></div>`
};

const k = new URLSearchParams(location.search).get("s") || "a";
const out = document.querySelector("#out");
out.innerHTML = STRIPS[k] || STRIPS.a;
const el = out.firstElementChild;
out.style.width = "960px";
out.style.height = ({ d: 540, c: 560, e: 340 }[k] || 720) + "px";
</script>
