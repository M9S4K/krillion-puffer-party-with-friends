<!doctype html><meta charset="utf-8"><title>panel state</title>
<link rel="stylesheet" href="../extension/content.css">
<style>html,body{margin:0;height:100%;background:#07101d}#kpj{position:fixed;inset-inline-end:14px;top:14px;width:306px;z-index:9}</style>
<div id="kpj" class="open">
<button id="kpj-pill" aria-label="Open party joiner"><i class="kpj-dot live"></i><span id="kpj-pill-txt">Party · alone</span></button>
<div id="kpj-stack"><div id="kpj-panel">
  <div id="kpj-top">
    <div id="kpj-id">
      <div id="kpj-kicker-row"><span id="kpj-kicker">Party name</span><button id="kpj-info" aria-label="About the party name" aria-describedby="kpj-tip"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.6" stroke-linecap="round"/><path d="M8 4.8v.5" stroke-linecap="round"/></svg></button><span id="kpj-tip" role="tooltip">Type out any name and ask your friends to type it in exactly to join the same party</span></div>
      <input id="kpj-name-input" type="text" value="puffa-trench-8471" aria-label="Party name" placeholder="name your party" spellcheck="false">
    </div>
    <button id="kpj-close" title="Hide" aria-label="Hide panel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke-linecap="round"/></svg></button>
  </div>
  <div id="kpj-who"></div>
  <div id="kpj-acts"><div id="kpj-cta">
    <div id="kpj-size-wrap">
      <button id="kpj-size" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Room size">
        <span id="kpj-size-txt">4-6</span>
        <svg class="kpj-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.6 6 7.6l3-3" stroke-linecap="round"/></svg>
      </button>
      <ul id="kpj-size-menu" role="listbox" aria-label="Room size" tabindex="-1" hidden></ul>
    </div>
    <button id="kpj-go" type="button"><i class="kpj-fill" aria-hidden="true"></i><span id="kpj-go-txt">Find room</span></button>
  </div></div>
  <button id="kpj-msg" type="button" role="status" aria-live="polite" title="Click to copy the diagnostic log">Linked - waiting for your friend</button>
</div></div></div>
<script type="module">
import { STATES } from "./panel-states.js";
const $ = s => document.querySelector(s);
const SIZES=[["any","Any"],["2","1v1"],["3","3s"],["6","4-6"],["10","8-10"],["12","10+"]];
$("#kpj-size-menu").innerHTML=SIZES.map(([v,l])=>`<li role="option" id="kpj-size-${v}" data-v="${v}" aria-selected="${v==="6"}">${l}</li>`).join("");

const api = {
  rows(list){                                  // [name, me, status, cls]
    $("#kpj-who").innerHTML = list.map(([n,me,st,cls=""]) =>
      `<div class="kpj-who-row ${cls}${me?" kpj-self":""}"><i class="kpj-dot live"></i><b>${n}</b>${
        me?'<em class="kpj-me">(you)</em>':""}<span>${st||""}</span></div>`).join("")
      + `<div class="kpj-who-row kpj-away"><i class="kpj-dot kpj-ghost"></i><button class="kpj-invite" type="button">invite +</button></div>`;
  },
  say(t){ $("#kpj-msg").textContent = t; },
  key(label, {hold=false, disabled=false, fill=null}={}){
    $("#kpj-go-txt").textContent = label;
    $("#kpj-go").dataset.hold = hold ? "1" : "";
    $("#kpj-go").disabled = disabled;
    if (fill !== null) $("#kpj-go .kpj-fill").style.clipPath = `inset(0 ${fill} 0 0)`;
  },
  size(label){ $("#kpj-size-txt").textContent = label; },
  menu(open){ $("#kpj-size-menu").hidden = !open; $("#kpj-size").setAttribute("aria-expanded", String(open));
              if (open) $("#kpj-size-6").classList.add("kpj-cursor"); },
  tip(show){ const t=$("#kpj-tip"); if(!show) return;
             for (const [k,v] of [["opacity","1"],["visibility","visible"],["transform","none"]]) t.style.setProperty(k,v,"important"); },
  party(v){ $("#kpj-name-input").value = v; },
  dot(state){ document.querySelectorAll(".kpj-dot:not(.kpj-ghost)").forEach(d=>d.className="kpj-dot "+state); },
  pill(txt){ $("#kpj-pill-txt").textContent = txt; },
  collapse(){ $("#kpj").classList.remove("open"); },
  toast(text, sticky=false){
    const t=document.createElement("div"); t.id="kpj-toast"; t.setAttribute("role","status");
    t.textContent = sticky ? text + "  (click to dismiss)" : text;
    t.className = "show" + (sticky ? " sticky" : "");
    document.documentElement.append(t);
  }
};
const key = new URLSearchParams(location.search).get("s") || "linked-alone";
(STATES[key] || STATES["linked-alone"]).build(api);
document.title = key;
</script>
