<!doctype html><meta charset="utf-8"><title>Krillion Party Joiner - panel states</title>
<link rel="stylesheet" href="../extension/content.css">
<style>
  body{margin:0;background:#07101d;min-height:100vh;font:13px ui-monospace,Menlo,monospace;color:#7d93b8}
  #bar{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:99}
  #bar button{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid #1c3050;background:#101d33;color:#a7b8d5;cursor:pointer}
  #bar button[aria-pressed=true]{background:#1c3050;color:#e8f1ff}
  #kpj{position:fixed;inset-inline-end:14px;top:14px;width:306px;z-index:9}
</style>
<div id="bar"></div>
<div id="kpj" class="open">
<button id="kpj-pill" aria-label="Open"><i class="kpj-dot live"></i><span id="kpj-pill-txt">Party · 2</span></button>
<div id="kpj-stack"><div id="kpj-panel">
  <div id="kpj-top">
    <div id="kpj-id">
      <div id="kpj-kicker-row"><span id="kpj-kicker">Party name</span><button id="kpj-info" aria-label="About the party name" aria-describedby="kpj-tip"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.6" stroke-linecap="round"/><path d="M8 4.8v.5" stroke-linecap="round"/></svg></button><span id="kpj-tip" role="tooltip">Make up any name, then tell your friends to type it exactly. Same name, same party. Only room codes travel between you.</span></div>
      <input id="kpj-name-input" type="text" value="puffa-trench-8471" aria-label="Party name" placeholder="name your party">
    </div>
    <button id="kpj-close" aria-label="Hide panel"><svg viewBox="0 0 16 16"><path d="M3.5 8h9" stroke-linecap="round"/></svg></button>
  </div>
  <div id="kpj-who"></div>
  <div id="kpj-acts"><div id="kpj-cta">
    <div id="kpj-size-wrap">
      <button id="kpj-size" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Room size">
        <span id="kpj-size-txt">4-6</span>
        <svg class="kpj-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.6 6 7.6l3-3" stroke-linecap="round"/></svg>
      </button>
      <ul id="kpj-size-menu" role="listbox" aria-label="Room size" tabindex="-1" hidden></ul>
    </div>
    <button id="kpj-go" type="button"><i class="kpj-fill" aria-hidden="true"></i><span id="kpj-go-txt">Find room</span></button>
  </div></div>
  <button id="kpj-msg" type="button" role="status">Linked - waiting for your friend</button>
</div></div></div>
<script>
const SIZES=[["any","Any"],["2","1v1"],["3","3s"],["6","4-6"],["10","8-10"],["12","10+"]];
const menu=document.querySelector("#kpj-size-menu");
menu.innerHTML=SIZES.map(([v,l])=>`<li role="option" id="kpj-size-${v}" data-v="${v}" aria-selected="${v==="6"}">${l}</li>`).join("");
const who=document.querySelector("#kpj-who"), msg=document.querySelector("#kpj-msg");
const go=document.querySelector("#kpj-go"), goTxt=document.querySelector("#kpj-go-txt");
const row=(n,me,st,cls="")=>`<div class="kpj-who-row ${cls}${me?" kpj-self":""}"><i class="kpj-dot live"></i><b>${n}</b>${me?'<em class="kpj-me">(you)</em>':""}<span>${st}</span></div>`;
const invite=`<div class="kpj-who-row kpj-away"><i class="kpj-dot kpj-ghost"></i><button class="kpj-invite" type="button">invite +</button></div>`;
const STATES={
  "alone":()=>{who.innerHTML=row("puffa",1,"browsing")+invite;goTxt.textContent="Find room";go.dataset.hold="";go.disabled=false;msg.textContent="Linked - waiting for your friend";},
  "waiting":()=>{who.innerHTML=row("puffa",1,"browsing")+row("Finum",0,"playing")+invite;goTxt.textContent="Find room";go.dataset.hold="";go.disabled=false;msg.textContent="Linked · puffa-trench-8471";},
  "together":()=>{who.innerHTML=row("puffa",1,"in GNFS")+row("Finum",0,"with you","kpj-same")+invite;goTxt.textContent="Hold to move";go.dataset.hold="1";go.disabled=false;msg.textContent="GNFS · 4/6 - you are both in.";},
  "holding":()=>{STATES.together();go.classList.add("kpj-holding");},
  "menu":()=>{STATES.alone();menu.hidden=false;},
  "no party":()=>{who.innerHTML=row("puffa",1,"browsing")+invite;document.querySelector("#kpj-name-input").value="";goTxt.textContent="Find room";go.dataset.hold="";go.disabled=true;msg.textContent="Name your party above, same on both machines.";},
  "collapsed":()=>{document.querySelector("#kpj").classList.remove("open");}
};
const bar=document.querySelector("#bar");
for(const k of Object.keys(STATES)){
  const b=document.createElement("button");b.textContent=k;b.setAttribute("aria-pressed","false");
  b.onclick=()=>{document.querySelector("#kpj").classList.add("open");menu.hidden=true;go.classList.remove("kpj-holding");
    document.querySelector("#kpj-name-input").value="puffa-trench-8471";
    [...bar.children].forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");STATES[k]();};
  bar.append(b);
}
bar.children[0].click();
document.querySelector("#kpj-size").onclick=()=>{menu.hidden=!menu.hidden;document.querySelector("#kpj-size").setAttribute("aria-expanded",String(!menu.hidden));};
</script>
