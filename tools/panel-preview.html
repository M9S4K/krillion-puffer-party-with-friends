<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../extension/content.css">
<style>body{margin:0;background:#07101d;height:100vh}#kpj{position:fixed;inset-inline-end:14px;top:14px;width:306px;z-index:9}</style>
<div id="kpj" class="open">
<button id="kpj-pill" aria-label="Open"><i class="kpj-dot"></i><span id="kpj-pill-txt">Party</span></button>
<div id="kpj-stack"><div id="kpj-panel">
  <div id="kpj-top">
    <div id="kpj-id">
      <div id="kpj-kicker-row"><span id="kpj-kicker">Party name</span><button id="kpj-info" aria-label="About the party name"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.6" stroke-linecap="round"/><path d="M8 4.8v.5" stroke-linecap="round"/></svg></button><span id="kpj-tip" role="tooltip">Both of you type the same party name.</span></div>
      <input id="kpj-name-input" type="text" value="puffa-trench-8471" aria-label="Party name">
    </div>
    <button id="kpj-close" aria-label="Hide panel"><svg viewBox="0 0 16 16"><path d="M3.5 8h9" stroke-linecap="round"/></svg></button>
  </div>
  <div id="kpj-who">
    <div class="kpj-who-row kpj-self"><i class="kpj-dot live"></i><b>puffa</b><em class="kpj-me">(you)</em><span>browsing</span></div>
    <div class="kpj-who-row kpj-away"><i class="kpj-dot kpj-ghost"></i><button class="kpj-invite" type="button">invite +</button></div>
  </div>
  <div id="kpj-acts"><div id="kpj-cta">
    <select id="kpj-size" aria-label="Room size"><option>4-6</option></select>
    <button id="kpj-go">Find room</button>
  </div></div>
  <button id="kpj-msg" type="button" role="status">Linked - waiting for your friend</button>
</div></div></div>
